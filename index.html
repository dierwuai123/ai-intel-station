<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 情报站</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0d12">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0b0d12;--bg2:#11141b;--card:#151923;--card-h:#1a1f2c;
  --line:#232936;--txt:#e8ebf2;--sub:#9aa3b8;--dim:#6b7385;
  --acc:#5b8cff;--acc-dim:rgba(91,140,255,.14);
  --green:#5fd39a;--red:#e0707a;--amber:#e0a458;--gold:#f0c04a;
}
html{-webkit-text-size-adjust:100%}
body{font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

/* ===== 顶栏 ===== */
.top{position:sticky;top:0;z-index:10;background:rgba(11,13,18,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
.logo .dot{width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px var(--acc-dim)}
.top .sp{flex:1}
.updated{font-size:12px;color:var(--dim);white-space:nowrap}
.btn{background:var(--acc);color:#fff;border:0;border-radius:9px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:transform .1s,opacity .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default}

/* ===== Tab 栏 ===== */
.tabs{max-width:1180px;margin:0 auto;padding:14px 22px 0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;padding:9px 16px;border-radius:11px;border:1px solid var(--line);background:var(--bg2);color:var(--sub);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s}
.tab:hover{color:var(--txt);border-color:#2e3648}
.tab.on{background:var(--acc-dim);border-color:var(--acc);color:var(--acc)}
.tab .n{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--sub);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.tab.on .n{background:var(--acc);color:#fff}

/* ===== 主区 ===== */
main{max-width:1180px;width:100%;margin:0 auto;padding:18px 22px 60px;flex:1}
section[hidden]{display:none}
.sec-head{display:flex;align-items:center;gap:10px;margin:6px 0 16px;flex-wrap:wrap}
.sec-head h2{font-size:15px;font-weight:800;letter-spacing:.3px}
.sec-head .hint{font-size:12px;color:var(--dim)}
.srcfilter{display:flex;gap:6px;margin-left:auto}
.sf{padding:6px 13px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);color:var(--sub);font-size:12.5px;font-weight:700;cursor:pointer;transition:all .15s}
.sf.on{background:var(--acc-dim);border-color:var(--acc);color:var(--acc)}
.sf .n{opacity:.75;margin-left:3px;font-size:11px}
.src-tag{font-style:normal;font-size:10.5px;color:var(--dim);background:rgba(255,255,255,.06);padding:1.5px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.sub-h{font-size:13px;font-weight:800;color:var(--sub);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.sub-h .hint{font-size:11.5px;font-weight:400;color:var(--dim)}
.pull-tip{position:absolute;top:100%;left:0;right:0;text-align:center;font-size:12px;color:var(--dim);padding:10px 0;transition:opacity .2s;opacity:0;pointer-events:none}
.pull-tip.show{opacity:1}
main{position:relative}

/* 我的仓库 */
.mygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.my{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;transition:border-color .15s,background .15s}
.my:hover{border-color:#313a50;background:var(--card-h)}
.my .fn{font-size:14.5px;font-weight:800;color:var(--acc);word-break:break-all}
.my .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.my .s{text-align:center;background:var(--bg2);border-radius:10px;padding:9px 4px}
.my .s .v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.my .s .k{font-size:10.5px;color:var(--dim);margin-top:2px}
.my .rel{margin-top:12px;font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.my .rel b{color:var(--green);font-weight:700}
.my .push{margin-top:6px;font-size:11px;color:var(--dim)}

/* 工具卡 */
.toolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.tool{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,background .15s}
.tool:hover{border-color:#313a50;background:var(--card-h)}
.tool .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tool .name{font-size:14px;font-weight:800;word-break:break-all}
.tool .stars{margin-left:auto;color:var(--gold);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tool .desc{font-size:12.5px;color:var(--sub);line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tool .meta{display:flex;gap:12px;font-size:11px;color:var(--dim);margin-top:auto}
.kd{font-size:10px;font-weight:800;padding:2.5px 8px;border-radius:999px;letter-spacing:.4px}
.kd.skill{background:rgba(95,211,154,.12);color:var(--green)}
.kd.review{background:var(--acc-dim);color:var(--acc)}
.kd.boilerplate{background:rgba(224,164,88,.12);color:var(--amber)}

/* 新闻行 */
.newslist{display:flex;flex-direction:column;gap:8px}
.news{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px;transition:border-color .15s,background .15s}
.news:hover{border-color:#313a50;background:var(--card-h)}
.news .rank{width:26px;text-align:center;font-size:13px;font-weight:800;color:var(--dim);font-variant-numeric:tabular-nums;flex-shrink:0}
.news .rank.hot{color:var(--amber)}
.news .tt{flex:1;font-size:13.5px;font-weight:600;line-height:1.55}
.news .sc{color:var(--amber);font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* PR 审核卡 */
.prlist{display:flex;flex-direction:column;gap:10px}
.pr{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.pr .r1{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pr .no{font-size:13px;font-weight:800;color:var(--acc)}
.pr .title{font-size:13.5px;font-weight:700;flex:1;min-width:200px}
.verdict{font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;letter-spacing:.4px}
.verdict.merge{background:rgba(95,211,154,.13);color:var(--green)}
.verdict.reject{background:rgba(224,112,122,.13);color:var(--red)}
.verdict.needs-review{background:rgba(224,164,88,.13);color:var(--amber)}
.pr .sum{font-size:12.5px;color:var(--sub);line-height:1.7;margin-top:9px}
.pr .risk{font-size:12.5px;color:var(--amber);line-height:1.6;margin-top:6px}
.pr .meta{display:flex;gap:12px;font-size:11px;color:var(--dim);margin-top:10px}

/* 状态 */
.empty{color:var(--dim);font-size:13px;text-align:center;padding:44px 0;background:var(--bg2);border:1px dashed var(--line);border-radius:14px;line-height:1.8}
.err{background:rgba(224,112,122,.1);border:1px solid rgba(224,112,122,.35);color:#e898a0;padding:12px 16px;border-radius:12px;font-size:13px;margin-bottom:16px;display:none}
.skel{background:linear-gradient(90deg,var(--card) 25%,var(--card-h) 50%,var(--card) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:14px;height:80px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

@media(max-width:640px){
  .top-in{padding:12px 16px;gap:10px}
  .updated{display:none}
  .tabs{padding:12px 16px 0}
  main{padding:14px 16px 50px}
  .mygrid,.toolgrid{grid-template-columns:1fr}
  .news .rank{display:none}
}
</style>
</head>
<body>

<div class="top">
  <div class="top-in">
    <div class="logo"><span class="dot"></span>AI 情报站</div>
    <div class="sp"></div>
    <span class="updated">更新 <span id="updated">—</span></span>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-t="my">📦 我的仓库 <span class="n" id="n-my">0</span></button>
    <button class="tab" data-t="tools">🛠 高分工具 <span class="n" id="n-tools">0</span></button>
    <button class="tab" data-t="news">📰 新闻 <span class="n" id="n-src-cn">0</span></button>
  </div>
</div>

<main>
  <div class="err" id="err"></div>

  <section id="sec-my">
    <div class="sec-head"><h2>我的发布仓库</h2><span class="hint">GitHub 数据每日 6:10 自动更新</span></div>
    <div class="mygrid" id="my"></div>
  </section>

  <section id="sec-tools" hidden>
    <div class="sec-head"><h2>高分工具 / 套件</h2><span class="hint">近期高分 · skill / review / boilerplate</span></div>
    <div class="toolgrid" id="tools"></div>
  </section>

  <section id="sec-news" hidden>
    <div class="sec-head"><h2>新闻头条</h2>
      <div class="srcfilter" id="srcfilter">
        <button class="sf on" data-s="cn">🇨🇳 中文 <span class="n" id="n-src-cn">0</span></button>
        <button class="sf" data-s="hn">HN <span class="n" id="n-src-hn">0</span></button>
      </div>
    </div>
    <div class="newslist" id="news"></div>
  </section>

  <section id="sec-pr" hidden></section>
</main>

<script>
"use strict";
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmt(n){return (n==null?'—':Number(n).toLocaleString())}

/* ---- Tab 切换 ---- */
document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(!b)return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===b));
  ['my','tools','news'].forEach(k=>{
    document.getElementById('sec-'+k).hidden = (k!==b.dataset.t);
  });
});
/* ---- 新闻源筛选 ---- */
document.getElementById('srcfilter').addEventListener('click',e=>{
  const b=e.target.closest('.sf'); if(!b)return;
  document.querySelectorAll('.sf').forEach(t=>t.classList.toggle('on',t===b));
  NEWS_SRC = b.dataset.s;
  if(DATA) renderNews(DATA.news);
});

/* ---- 渲染 ---- */
let NEWS_SRC = 'cn';
let DATA = null;
// href 白名单：仅 http(s) 输出，其余降级为 javascript:void(0)（不可执行恶意协议）
function href(u){ return /^https?:\/\//i.test(u||'') ? esc(u) : 'javascript:void(0)'; }
function render(d){
  DATA = d;
  const my=d.myrepos||[], tools=d.repos||[], news=d.news||[], prs=d.pr_reviews||[];
  document.getElementById('n-my').textContent=my.length;
  document.getElementById('n-tools').textContent=tools.length;
  const cnN = news.filter(n=>n.src!=='hn').length;
  const hnN = news.filter(n=>n.src==='hn').length;
  document.getElementById('n-src-cn').textContent=cnN;
  document.getElementById('n-src-hn').textContent=hnN;
  document.getElementById('updated').textContent=(d.updated&&d.updated[0]&&d.updated[0].t)||'—';
  renderNews(news);
  renderMy(my);
  renderTools(tools);
}
function renderNews(news){
  const list = NEWS_SRC==='hn' ? news.filter(n=>n.src==='hn') : news.filter(n=>n.src!=='hn');
  const SRC_NAME={ithome:'IT之家',solidot:'Solidot',sspai:'少数派',infoq:'InfoQ',hn:'HN'};
  const rankCls = NEWS_SRC==='hn' ? (i)=>(i<3?' hot':'') : ()=>'';

  document.getElementById('news').innerHTML = list.map((n,i)=>
    '<a class="news" href="'+href(n.url)+'" target="_blank" rel="noopener noopener noreferrer">'+
    '<span class="rank'+rankCls(i)+'">'+(i+1)+'</span>'+
    '<span class="tt">'+esc(n.title_zh||n.title)+(n.src!=='hn'?' <em class="src-tag">'+(SRC_NAME[n.src]||n.src)+'</em>':'')+'</span>'+
    (n.src==='hn'?'<span class="sc">▲ '+fmt(n.score)+'</span>':'')+
    '</a>').join('') ||
    '<div class="empty">暂无数据，每日 6:10 自动抓取</div>';
}

function renderMy(my){
  const prs=(DATA&&DATA.pr_reviews)||[];
  const VC={merge:'#5fd39a',reject:'#e0707a','needs-review':'#e0a458'};
  const VL={merge:'可合并',reject:'建议拒绝','needs-review':'需人工复核'};
  const prHtml = prs.length ? '<h3 class="sub-h">🤖 AI 审核 PR <span class="hint">每日 6:20 自动扫描</span></h3>' +
    '<div class="prlist">'+prs.map(p=>
    '<div class="pr">'+
    '<div class="r1"><span class="no">#'+esc(p.pr)+'</span><span class="title">'+esc(p.title)+'</span>'+
    '<span class="verdict '+esc(p.verdict)+'" style="color:'+(VC[p.verdict]||'#9aa3b8')+'">'+(VL[p.verdict]||esc(p.verdict))+' '+Math.round((p.confidence||0)*100)+'%</span></div>'+
    '<div class="sum">'+esc(p.summary)+'</div>'+
    (p.risks?'<div class="risk">⚠ '+esc(p.risks)+'</div>':'')+
    '<div class="meta"><span>'+esc(p.repo)+'</span><span>by '+esc(p.author)+'</span><span>'+esc(p.created_at)+'</span></div>'+
    '</div>').join('')+'</div>' : '';

  document.getElementById('my').innerHTML =
    '<h3 class="sub-h">📦 仓库数据</h3><div class="mygrid">' +
    (my.map(r=>
    '<div class="my">'+
    '<a class="fn" href="'+href('https://github.com/'+r.full_name)+'" target="_blank" rel="noopener noopener noreferrer">'+esc(r.full_name)+'</a>'+
    '<div class="stats">'+
    ['stars|'+r.stars,'forks|'+r.forks,'watch|'+r.watchers,'issues|'+r.open_issues].map(x=>{
      const p=x.split('|');
      return '<div class="s"><div class="v">'+fmt(p[1])+'</div><div class="k">'+p[0]+'</div></div>';
    }).join('')+
    '</div>'+
    (r.release?'<div class="rel">🏷️ 最新发布 <b>'+esc(r.release)+'</b></div>':'')+
    '<div class="push">最近推送 '+esc((r.pushed_at||'').slice(0,10))+'</div>'+
    '</div>').join('') ||
    '<div class="empty" style="grid-column:1/-1">暂无数据，每日 6:10 自动抓取</div>') +
    '</div>' + prHtml;
}
function renderTools(tools){
  document.getElementById('tools').innerHTML = tools.map(r=>
    '<a class="tool" href="'+href(r.url)+'" target="_blank" rel="noopener noopener noreferrer">'+
    '<div class="r1"><span class="name">'+esc(r.full_name)+'</span><span class="kd '+esc(r.kind)+'">'+esc(r.kind)+'</span><span class="stars">★ '+fmt(r.stars)+'</span></div>'+
    '<div class="desc">'+esc(r.desc_zh||r.desc)+'</div>'+
    '<div class="meta"><span>'+esc(r.lang||'—')+'</span><span>push '+(r.pushed_at||'').slice(0,10)+'</span></div>'+
    '</a>').join('') ||
    '<div class="empty" style="grid-column:1/-1">暂无数据</div>';
}

function load(){
  fetch('api/overview').then(r=>r.json()).then(d=>{
    document.getElementById('err').style.display='none';
    render(d);
  }).catch(e=>{
    const el=document.getElementById('err');
    el.style.display='block'; el.textContent='加载失败：'+e;
  });
}

/* ---- 下拉刷新：顶部下拉 >70px 触发采集 ---- */
const pullTip=document.createElement('div');
pullTip.className='pull-tip';
document.querySelector('main').appendChild(pullTip);
let touchStartY=0, pulling=false, pullArmed=false;
document.addEventListener('touchstart',e=>{
  if(window.scrollY<=0){ touchStartY=e.touches[0].clientY; pullArmed=true; }
  else pullArmed=false;
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!pullArmed||pulling)return;
  const dy=e.touches[0].clientY-touchStartY;
  if(dy>20&&dy<160){
    pullTip.textContent=dy>70?'松手刷新':'下拉刷新…';
    pullTip.classList.toggle('show',dy>20);
  }
},{passive:true});
document.addEventListener('touchend',e=>{
  const dy=e.changedTouches[0].clientY-touchStartY;
  pullTip.classList.remove('show');
  if(pullArmed&&!pulling&&dy>70){
    pulling=true;
    pullTip.textContent='采集中…'; pullTip.classList.add('show');
    fetch('api/collect',{method:'POST'}).then(()=>setTimeout(()=>{pullTip.classList.remove('show');pulling=false;load();},2500))
    .catch(()=>{pullTip.classList.remove('show');pulling=false;});
  }
  pullArmed=false;
},{passive:true});

/* ---- 自动刷新：每小时静默拉新数据（数据实时渲染不打扰） ---- */
setInterval(load, 60*60*1000);

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
load();
</script>
</body>
</html>
